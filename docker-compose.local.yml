# Local development stack (backend + MongoDB).
# Usage: docker compose -f docker-compose.local.yml up --build
name: online-closet-local

services:
  backend:
    image: online-closet_backend:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      # Values here override ./.env
      - HOST=0.0.0.0
      - API_PORT=17085
      - NODE_ENV=development
      - PRODUCTION=false
      - UPLOAD_PATH=/usr/src/app/public/uploads
      - MONGO_URL=mongodb://mongo:27017/online-closet
    ports:
      - "17085:17085"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./public/uploads:/usr/src/app/public/uploads:rw

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      # Host port 27018 avoids clashing with a locally installed MongoDB
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web UI for browsing the database: http://localhost:8081
  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    ports:
      - "8082:8081"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
